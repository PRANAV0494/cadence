[build-system]
# PEP 639 `license` / `license-files` need setuptools >= 77.0.3. Without this
# table, pip's legacy fallback happened to provision a current setuptools in
# the isolated build env and the keys worked by luck; --no-build-isolation
# against this repo's own .venv (setuptools 65.5.0) failed with
# "`project.license` must be valid exactly by one definition".
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence"
version = "0.1.0"
description = "Continuous attestation of who is driving an authenticated web session"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Kept in step with deploy/requirements.txt, which is what CI and Lambda
# install. An empty list meant `pip install .` produced import errors.
dependencies = [
  "fastapi==0.109.2",
  "mangum==0.17.0",
  "boto3==1.34.34",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "pydantic==2.6.1",
  "uvicorn==0.27.1",
]

[project.scripts]
cadence = "cadence.cli:main"

[project.optional-dependencies]
# httpx <0.28: starlette 0.36 (fastapi 0.109.2) uses the app= kwarg httpx removed.
dev = ["pytest>=8.0", "httpx>=0.27,<0.28"]
proxy = ["mitmproxy>=10.3,<12"]

[tool.pytest.ini_options]
# tests/legacy holds unported suites inherited from the pre-consolidation
# repositories. They import packages that no longer exist and are kept as
# reference, not as a gate. See tests/legacy/README.md.
testpaths = ["tests"]
norecursedirs = ["tests/legacy", "reference", "notebooks", "data"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["cadence*", "edge*"]

[tool.setuptools.package-data]
# cadence proxy hands mitmproxy a real file path for the addon; the SDK
# source is read at addon import. Without these, pip install . ships the
# Python but not the files the CLI needs (review finding on #8).
edge = ["*.js", "*.py"]
