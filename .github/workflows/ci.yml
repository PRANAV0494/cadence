name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The SDK contract tests drive the real capture SDK under Node and feed
      # its output to the Python extractor. Without Node they skip silently,
      # which would defeat the point of having them.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        # The API tests exercise real endpoints through TestClient, so the
        # runtime dependencies are required, not just the test runner.
        run: |
          # Install the pinned runtime first, then a test client compatible
          # with it. deploy/requirements.txt pins fastapi 0.109.2, whose
          # TestClient passes app= to httpx.Client — a keyword httpx removed
          # in 0.28. Testing against the versions we deploy is the point.
          python -m pip install --quiet -r deploy/requirements.txt
          python -m pip install --quiet pytest "httpx<0.28"

      - name: Verify Node is present
        run: |
          node --version
          echo "Node available — SDK contract tests will run, not skip."

      - name: Run tests
        run: python -m pytest -v

      # Every measured number quoted in the documentation must match
      # evaluation/results.json. A fabricated p-value once travelled from a
      # notebook into a CV and onto a public profile because nothing connected
      # the claim to the computation. This makes that connection mechanical.
      - name: Documentation matches measured results
        run: python evaluation/check_docs.py

  guard:
    name: repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This project collects keystroke timings from real people. A single
      # careless `git add -A` would publish them irreversibly. These checks
      # exist because that has nearly happened once already.
      - name: No participant data
        run: |
          # Case-insensitive: a Windows checkout can yield data/Private/.
          if git ls-files | grep -iE '^data/private/|keystroke_export_.*\.csv$|\.participant\.csv$'; then
            echo "::error::Participant data is committed. Remove it and verify .gitignore."
            exit 1
          fi
          echo "OK — no participant data tracked."

      - name: No third-party datasets
        run: |
          if git ls-files | grep -iE 'DSL-StrongPasswordData\.csv|^data/(keyrecs|aalto)/'; then
            echo "::error::A redistributed dataset is committed. Ship a download script instead."
            exit 1
          fi
          echo "OK — no datasets tracked."

      - name: No large or unexpected model blobs
        run: |
          # Allowlist the two specific files, not the directory. A directory
          # allowlist let any pickle dropped into models/network/ through, and
          # the 10 MB backstop is per file — the 153 per-user identity models
          # (~1.5 MB each) would have fitted comfortably.
          unexpected=$(git ls-files | grep -E '\.(pkl|joblib)$' \
            | grep -vE '^models/network/cicids2017_(scaler|xgboost_model)\.pkl$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Model blobs outside models/network/ are committed:"
            echo "$unexpected"
            echo "Use GitHub Releases or DVC."
            exit 1
          fi
          oversize=$(git ls-files | while read -r f; do
            [ -f "$f" ] && [ "$(stat -c%s "$f")" -gt 10485760 ] && echo "$f ($(stat -c%s "$f") bytes)"
          done || true)
          if [ -n "$oversize" ]; then
            echo "::error::Files over 10 MB are committed:"
            echo "$oversize"
            exit 1
          fi
          echo "OK — no unexpected or oversized binaries."

      - name: No tracked env or secrets files
        run: |
          # Gitignored is not guarded: `git add -f` bypasses .gitignore entirely.
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]+$|samconfig\.local\.toml$' \
             | grep -v '^\.env\.example$'; then
            echo "::error::An environment or secrets file is tracked."
            exit 1
          fi
          echo "OK — no tracked env files."

      - name: Notebooks do not carry the retracted p-value
        run: |
          # check_docs.py scans markdown only, and notebooks are where the
          # fabricated statistic originated. A plain substring check is enough.
          if git ls-files '*.ipynb' | xargs -r grep -l -e '4\.7e-21' -e '4\.689e-21' -e '4\.689064502037325e-21'; then
            echo "::error::A notebook contains the retracted p-value. Clear the cell output or annotate it."
            exit 1
          fi
          echo "OK — no retracted value in notebooks."

      - name: No hardcoded credentials
        run: |
          # Implemented in Python rather than a shell regex: the previous
          # pattern matched only ALL-CAPS names with double-quoted values, so
          # single-quoted and unquoted assignments passed. Notebooks are no
          # longer excluded — a key pasted into a cell leaks just as publicly.
          python - <<'EOF'
          import re, subprocess, sys

          SKIP = ("docs/", "CONTRIBUTING.md", "MANIFEST.md")
          NAMES = r"(?:JWT_SECRET_KEY|JwtSecretKey|ADMIN_PASSWORD_HASH|AdminPasswordHash|[A-Za-z0-9_]*(?:PASSWORD|SECRET|TOKEN|API_KEY)[A-Za-z0-9_]*)"
          # Value: double-quoted, single-quoted, or bare — all >= 8 chars. The
          # bare form excludes brackets so it stops at "(", which lets the
          # call-detection below distinguish `= _required(...)` from a literal.
          VALUE = r"""(?:"[^"\n]{8,}"|'[^'\n]{8,}'|[^\s"'#,()\[\]{}]{8,})"""
          ASSIGN = re.compile(rf"{NAMES}\s*[:=]\s*{VALUE}")
          OTHER = re.compile(r"change-me-in-produc[t]ion|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----")
          # Placeholders and references, not secrets.
          # Config reads, template refs and placeholders are not secrets.
          BENIGN = re.compile(r"os\.environ|getenv|process\.env|\$\{|!Ref|<[^>]+>|xxx+|\.\.\.|example|placeholder|your-|CHANGEME", re.I)

          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          hits = []
          for f in files:
              if f.startswith(SKIP) or f == ".env.example":
                  continue
              try:
                  text = open(f, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if BENIGN.search(line):
                      continue
                  m = ASSIGN.search(line)
                  if m and line[m.end() : m.end() + 1] == "(":
                      m = None  # the "value" is a function name: a config read
                  if m or OTHER.search(line):
                      hits.append(f"{f}:{n}: {line.strip()[:120]}")
          if hits:
              print("::error::Possible hardcoded credential:")
              print("\n".join(hits))
              sys.exit(1)
          print("OK — no hardcoded credentials in tracked files.")
          EOF

      - name: Deploy template ships no secret defaults
        run: |
          # Matching known literals only caught the mistake already made. The
          # defect class is *any* Default on a secret parameter, since sam
          # deploy without an override ships it. A missing template also used
          # to pass, because grep exits 2 and `if` reads that as false.
          test -f deploy/template.yaml || {
            echo "::error::deploy/template.yaml is missing."; exit 1; }
          python - <<'EOF'
          import re, sys

          text = open("deploy/template.yaml", encoding="utf-8").read()
          bad = []
          for name in ("JwtSecretKey", "AdminUsername", "AdminPasswordHash"):
              block = re.search(rf"^  {name}:\n((?:    .*\n|\n)*)", text, re.MULTILINE)
              if block and re.search(r"^    Default:", block.group(1), re.MULTILINE):
                  bad.append(name)
          if bad:
              print(f"::error::Secret parameters carry a Default: {', '.join(bad)}. "
                    f"sam deploy without an override would ship it.")
              sys.exit(1)
          print("OK — no Default on any secret parameter.")
          EOF
